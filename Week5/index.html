<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore upcoming Tech Club events, workshops, and coding sessions.">
  <title>Tech Club - Upcoming Events</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
    }

    .card {
      width: min(100% - 2rem, 960px);
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 12px;
      color: #1f2937;
      background: #fff;
      box-shadow: 0 4px 16px rgb(31 41 55 / 10%);
      overflow-x: auto;
    }

    #hero {
      padding: 1.25rem;
      color: #fff;
      background: #1e3a8a;
      text-align: center;
    }
  </style>
</head>
<body>
  <header id="hero">
    <h1>Tech Club</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="#events">Events</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="events" class="card" aria-labelledby="events-heading">
      <h2 id="events-heading">Upcoming Events</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th scope="col">Event</th>
              <th scope="col">Date</th>
              <th scope="col">Venue</th>
              <th scope="col">Fee (Rs.)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>HTML Workshop</td>
              <td>05 Nov 2026</td>
              <td>Lab 1</td>
              <td>0</td>
            </tr>
            <tr>
              <td>Java Quiz</td>
              <td>12 Nov 2026</td>
              <td>Seminar Hall</td>
              <td>50</td>
            </tr>
            <tr>
              <td>Hackathon</td>
              <td>20 Nov 2026</td>
              <td>Main Auditorium</td>
              <td>100</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3">Total events: 3</td>
              <td>Total fee: 150</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 Tech Club</p>
  </footer>
</body>
</html>
