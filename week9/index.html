<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">MyBrand</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to MyBrand</h1>
    <p>One simple page that looks good on a phone, a tablet and a laptop.</p>
    <a class="hero-btn" href="#">Get Started</a>

    <!-- 9.2 Image: 800px wide, but shrinks to fit small screens -->
    <img
      class="hero-img"
      src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><rect width='800' height='400' fill='%23bbdefb'/><text x='400' y='215' font-size='48' text-anchor='middle' fill='%230d47a1' font-family='Arial'>Hero Image</text></svg>"
      alt="Hero placeholder image">
  </section>

  <section class="features">
    <div class="feature">
      <h3>Fast</h3>
      <p>Loads quickly on any device.</p>
    </div>
    <div class="feature">
      <h3>Responsive</h3>
      <p>Adjusts to every screen size.</p>
    </div>
    <div class="feature">
      <h3>Simple</h3>
      <p>Clean and easy to read.</p>
    </div>
    <div class="feature">
      <h3>Modern</h3>
      <p>Built with Grid and Flexbox.</p>
    </div>
  </section>

  <footer class="footer">&copy; 2026 MyBrand</footer>

</body>
</html>
